# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: Single-cell Integration
  description: >-
    Puts all samples of a single-cell or single-nucleus RNA-seq study into one shared space, so
    the same cell type from different donors, batches or conditions lands together, then
    clusters the cells (Leiden; C01, C02, ... shared across samples) and draws a UMAP. The step
    after sc-qc in the Single-nucleus Atlas Mapping workflow. Highly variable genes are chosen
    on the raw counts across batches (Seurat v3 method), then either Harmony corrects the joint
    PCA (the CPU default; fast and light) or scVI learns a batch-corrected latent space from the
    counts (the GPU default; one of the methods the scib benchmark of Luecken et al. 2022 found
    to perform well, particularly on complex integration tasks), with optional categorical
    covariates. Rewrites each sample's .h5ad with obsm X_pca, X_integrated and X_umap and obs
    cluster, writes labels.csv for sc-annotate, st-compare and sc-report, and reports two scib
    metrics (iLISI batch mixing, cluster silhouette) before and after integration, with UMAPs by
    sample, condition and cluster.
  type: processor
  tags:
    - single-cell
    - single-nucleus
    - transcriptomics
    - genomics
    - integration
    - batch-correction
    - clustering
    - harmony
    - scvi
    - neuroscience
    - pain
    - musculoskeletal
runtime:
  # Shared by both variants (below); these are the cpu variant's. All samples are held at once
  # (counts CSR float32 while choosing HVGs, then HVGs only). Measured in the linux/amd64 image
  # (amd64 emulation on an M-series Mac, 4 CPUs): DRG demo, 18,439 nuclei, Harmony 122 s, peak RSS
  # 1.8 GB; 92,195 nuclei 241 s, 2.7 GB. Peak ~ 1.6 GiB + 12 bytes per non-zero count, so 16 GiB
  # holds 300 k nuclei with up to ~3,500 detected genes each (README "Runtime").
  cpu: 4096
  memory: 16384
  computeTypes:
    - standard
  timeoutSeconds: 28800
parameters:
  - name: METHOD
    type: string
    label: Integration method
    description: >-
      harmony: Harmony (Korsunsky et al. 2019) corrects the joint PCA for the batch column (and
      covariates); minutes on CPU. scvi: scVI (Lopez et al. 2018) learns a 30-dimensional latent
      space from the HVG counts with the batch (and covariates) as conditions; better on complex,
      many-donor atlases (Luecken et al. 2022) but slow on CPU: the gpu variant's default.
    defaultValue: harmony
    validValues: [harmony, scvi]
  - name: BATCH_COLUMN
    type: string
    label: Batch column
    description: >-
      obs column that defines the batches to integrate (also the HVG batches). auto: subject_id
      (the donor, which sc-prep puts on every cell from SPARC subject metadata) when every sample
      has one, else sample_id. Integrating by donor removes donor and library effects while one
      donor's samples (left and right ganglia, several joint tissues) keep their differences; set
      sample_id to treat every library as its own batch.
    defaultValue: auto
  - name: COVARIATES
    type: string
    label: Extra covariates
    description: >-
      Comma-separated categorical obs columns also removed (e.g. chemistry, site). Harmony corrects
      for each; scVI takes them as categorical covariates. Never list the condition you want to
      compare: its differences would be removed too. Empty: none.
    defaultValue: ""
  - name: N_HVG
    type: integer
    label: Highly variable genes
    description: Genes chosen by scanpy's seurat_v3 flavour on the counts, ranked across batches; used for the PCA and scVI.
    defaultValue: 3000
    min: 50
    max: 20000
  - name: N_PCS
    type: integer
    label: Principal components
    description: Components of the joint PCA (the input of Harmony and of obsm X_pca).
    defaultValue: 50
    min: 2
    max: 200
  - name: MAX_EPOCHS
    type: integer
    label: scVI epochs
    description: >-
      scVI training epochs; 0 = scvi-tools' own rule, min(400, 20000 / cells x 400) (400 below
      20,000 cells, 27 at 300,000). Ignored by Harmony.
    defaultValue: 0
    min: 0
    max: 1000
  - name: N_NEIGHBORS
    type: integer
    label: Neighbours
    description: Nearest neighbours per cell in the graph built on the integrated embedding (Leiden and UMAP).
    defaultValue: 15
    min: 2
    max: 200
  - name: RESOLUTION
    type: number
    label: Leiden resolution
    description: Higher gives more, smaller clusters. 1.0 splits the main nuclei classes of a ganglion or joint tissue; raise it for neuron subtypes.
    defaultValue: 1.0
    min: 0.01
    max: 10
  - name: SEED
    type: integer
    label: Random seed
    description: Seed for the PCA, Harmony, scVI, Leiden, UMAP and the metric subsample.
    defaultValue: 42
  - name: THREADS
    type: integer
    label: Threads
    description: BLAS / numba / Harmony / PyTorch threads; 0 = from the container's CPU quota.
    defaultValue: 0
    min: 0
    max: 64
inputs:
  - name: cells
    description: >-
      sc-qc's <sample_id>.h5ad, one per sample: X log-normalized (CSR), raw counts in
      layers["counts"], obs sample_id and the sample metadata columns (condition, donor, ...).
      Without links every .h5ad under the input is a sample.
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
    placement: subfolder
    required: true
outputs:
  - name: cells
    description: >-
      cells/<sample_id>.h5ad: the same files, observations in the same order, plus obsm X_pca,
      X_integrated (Harmony-corrected PCs or scVI latent), X_umap, obs cluster (C01.., shared
      across samples) and uns pennsieve.integration; provenance.json.
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
      - application/json
  - name: labels
    description: >-
      labels/labels.csv (sample_id, obs_id, cluster), cluster_summary.csv (sample_id, cluster,
      n_obs, fraction), summary.json, provenance.json.
    mediaTypes:
      - text/csv
      - application/json
  - name: integration
    description: >-
      integration/metrics.csv (embedding, metric, value, n_obs: iLISI batch mixing and cluster
      silhouette before and after integration), hvg.csv (gene, rank, n_batches), umap_sample.png,
      umap_condition.png, umap_cluster.png, scvi_history.csv (scVI), summary.json, provenance.json.
    mediaTypes:
      - text/csv
      - image/png
      - application/json
# One repository, two images (docs/app-variants.md in workflow-single-cell). The Dockerfile's
# TORCH_FLAVOUR picks the PyTorch build: CPU-only for the cpu variant, CUDA for the gpu variant.
variants:
  - id: cpu
    name: CPU (Harmony)
    default: true
    description: CPU-only PyTorch on a standard task; Harmony by default (minutes for 100 k nuclei). scVI also runs here, slowly.
    build:
      args:
        TORCH_FLAVOUR: cpu
    runtime:
      computeTypes: [standard]
  - id: gpu
    name: GPU (scVI)
    description: >-
      CUDA PyTorch on an NVIDIA GPU (T4 or newer); scVI by default. The GPU tier's 14 GiB holds
      about 200 k nuclei at 2,500 detected genes each (estimated); larger studies: the cpu variant
      with METHOD=scvi and more memory.
    build:
      args:
        TORCH_FLAVOUR: cuda
    runtime:
      computeTypes: [gpu]
      memory: 14336
    parameters:
      METHOD:
        defaultValue: scvi
